# Builds the GUI and CLI installers for Windows and Linux.
# Push a v* tag to publish them as a GitHub release.
name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
          - { os: ubuntu-22.04,   target: linux-x86_64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build GUI
        run: cargo build --release --bin nullware-installer
      - name: Build CLI (no GUI toolkit)
        run: cargo build --release --no-default-features --bin nullware-installer-cli

      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp "target/release/nullware-installer${{ matrix.ext }}"     "dist/nullware-installer-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/release/nullware-installer-cli${{ matrix.ext }}" "dist/nullware-installer-cli-${{ matrix.target }}${{ matrix.ext }}"
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt" && cat SHA256SUMS-*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
